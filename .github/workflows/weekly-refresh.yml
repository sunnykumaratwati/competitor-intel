name: Weekly competitor refresh

on:
  # Every Monday at 03:30 UTC (~9:00 AM IST)
  schedule:
    - cron: "30 3 * * 1"
  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write   # needed to push refreshed MDs back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run refresher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/refresh_all.py | tee refresh.log
          # Capture the SUMMARY_JSON line for the commit message body
          grep "^SUMMARY_JSON=" refresh.log | sed 's/^SUMMARY_JSON=//' > summary.json || echo "{}" > summary.json

      - name: Commit & push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain competitors/)" ]; then
            echo "No competitor MD changes — skipping commit."
            exit 0
          fi

          REFRESHED=$(python -c "import json; d=json.load(open('summary.json')); print(', '.join(d.get('refreshed', [])) or 'none')")

          git add competitors/
          git commit -m "chore(refresh): weekly competitor refresh

          Refreshed: ${REFRESHED}

          See refresh.log artifact for details."
          git push

      - name: Upload refresh log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log
          path: |
            refresh.log
            summary.json
          retention-days: 30
